name: Sync release notes

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Semver release tag to repair, such as v0.31.72
        required: true
        type: string

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Sync the full changelog range
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be a semver tag such as v0.31.64." >&2
            exit 1
          fi

          git fetch --tags --force
          previous_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "${RELEASE_TAG}^" 2>/dev/null || true)"
          previous_release_version="${previous_tag#v}"
          marker="<!-- awmpc-changelog-range:$version -->"
          legacy_marker="<!-- awmpc-changelog-entry:$version -->"
          gh release view "$RELEASE_TAG" --json body --jq '.body // ""' > /tmp/generated-release-notes.md
          if grep -Fq "$marker" /tmp/generated-release-notes.md; then
            echo "Changelog range for $version is already present."
            exit 0
          fi

          awk -v version="$version" -v previous="$previous_release_version" '
            function heading(value) { return "^## v?" value "([[:space:]]|$)" }
            $0 ~ heading(version) { in_range = 1 }
            in_range && previous != "" && $0 ~ heading(previous) { exit }
            in_range { print }
          ' CHANGELOG.md > /tmp/changelog-range.md

          test -s /tmp/changelog-range.md || {
            echo "No CHANGELOG.md range found for $version." >&2
            exit 1
          }

          if grep -Fq "$legacy_marker" /tmp/generated-release-notes.md; then
            awk -v marker="$legacy_marker" '
              { line = $0; sub(/\r$/, "", line) }
              line == marker { skip = 1; in_entry = 0; next }
              skip && !in_entry && /^## / { in_entry = 1; next }
              skip && in_entry && (/^## / || /^<!-- Release notes generated/) { skip = 0 }
              !skip { print }
            ' /tmp/generated-release-notes.md > /tmp/base-release-notes.md
          else
            cp /tmp/generated-release-notes.md /tmp/base-release-notes.md
          fi

          {
            printf '%s\n' "$marker"
            cat /tmp/changelog-range.md
            if [ -n "$previous_tag" ]; then
              printf '\n## Commits since %s\n\n' "$previous_tag"
              git log --no-merges --format='- %s (%h)' "${previous_tag}..${RELEASE_TAG}"
            fi
            if [ -s /tmp/base-release-notes.md ]; then
              printf '\n'
              cat /tmp/base-release-notes.md
            fi
          } > /tmp/release-notes.md

          gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file /tmp/release-notes.md
